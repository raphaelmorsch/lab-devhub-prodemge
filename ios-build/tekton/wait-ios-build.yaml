apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: wait-ios-build
  namespace: prodemge
  labels:
    app.kubernetes.io/part-of: prodemge-ios
spec:
  description: Aguarda o build registrado no coordenador e só termina com sucesso quando o Mac entrega o IPA.
  params:
    - name: coordinator-url
      type: string
      default: "http://macos-build-coordinator.prodemge.svc:8080"
    - name: coordinator-public-url
      type: string
      default: "https://macos-build-coordinator-prodemge.apps.ocp.bct9l.sandbox1479.opentlc.com"
    - name: gitlab-url
      type: string
      default: ""
      description: Mantido para pipelines já gerados. A consulta vai ao coordenador.
    - name: project-id
      type: string
      default: ""
      description: Mantido para pipelines já gerados.
    - name: pipeline-id
      type: string
      description: Identificador do build devolvido pelo coordenador.
    - name: expected-sha
      type: string
      default: ""
      description: Revisão solicitada. A Task falha se o build acompanhado não for essa revisão.
    - name: poll-interval
      type: string
      default: "15"
    - name: timeout
      type: string
      default: "1800"
    - name: secret-name
      type: string
      default: macos-build-api
  results:
    - name: status
      description: Estado terminal do build.
    - name: gitlab-pipeline-url
      description: URL do build no coordenador.
    - name: git-sha
      description: Commit resolvido pelo Mac, ou a revisão solicitada quando o checkout não chegou a gravá-lo.
    - name: artifact-reference
      description: IPA disponível no coordenador quando o build conclui com sucesso.
  steps:
    - name: wait
      image: image-registry.openshift-image-registry.svc:5000/openshift/nodejs:22-ubi8
      env:
        - name: COORDINATOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.secret-name)
              key: token
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [ -z "${COORDINATOR_TOKEN}" ]; then
          echo "Token do coordenador ausente no Secret $(params.secret-name)."
          exit 1
        fi
        base="$(params.coordinator-url)"
        base="${base%/}"
        public="$(params.coordinator-public-url)"
        public="${public%/}"
        build="$(params.pipeline-id)"
        expected="$(params.expected-sha)"
        interval="$(params.poll-interval)"
        timeout="$(params.timeout)"
        deadline="$((SECONDS + timeout))"
        url="${base}/builds/${build}"
        echo "Aguardando build ${build}."

        while true; do
          if [ "${SECONDS}" -ge "${deadline}" ]; then
            echo "Tempo esgotado depois de ${timeout}s."
            exit 1
          fi
          tmp="$(mktemp)"
          status="$(curl -sS --max-time 60 -o "${tmp}" -w "%{http_code}" \
            -H "Authorization: Bearer ${COORDINATOR_TOKEN}" \
            "${url}" || true)"
          case "${status}" in
            200)
              ;;
            429|500|502|503|504)
              echo "Consulta retornou HTTP ${status}. Nova tentativa em ${interval}s."
              rm -f "${tmp}"
              sleep "${interval}"
              continue
              ;;
            *)
              echo "Consulta do build falhou. HTTP ${status}."
              rm -f "${tmp}"
              exit 1
              ;;
          esac
          read -r state revision resolved artifact <<EOF
        $(node -e '
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          const state = data.status || "";
          const revision = data.source_revision || "";
          const resolved = data.resolved_sha || revision;
          const artifact = data.artifact_ready ? "ipa" : "";
          process.stdout.write([state, revision, resolved, artifact].join(" "));
        ' "${tmp}")
        EOF
          errfile="$(mktemp)"
          logfile="$(mktemp)"
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            fs.writeFileSync(process.argv[2], data.error || "");
            fs.writeFileSync(process.argv[3], data.log_tail || "");
          ' "${tmp}" "${errfile}" "${logfile}"
          rm -f "${tmp}"
          echo "Estado ${state}."
          case "${state}" in
            succeeded|failed)
              if [ -n "${expected}" ] && [ "${revision}" != "${expected}" ]; then
                echo "O build ${build} é da revisão ${revision}, diferente de ${expected}."
                rm -f "${errfile}" "${logfile}"
                exit 1
              fi
              page="${public}/builds/${build}"
              printf '%s' "${state}" > "$(results.status.path)"
              printf '%s' "${page}" > "$(results.gitlab-pipeline-url.path)"
              printf '%s' "${resolved}" > "$(results.git-sha.path)"
              printf '%s' "${artifact}" > "$(results.artifact-reference.path)"
              echo "Build: ${page}"
              if [ "${state}" != "succeeded" ]; then
                echo "Build do Mac terminou com falha."
                cat "${errfile}"
                echo
                cat "${logfile}"
                rm -f "${errfile}" "${logfile}"
                exit 1
              fi
              rm -f "${errfile}" "${logfile}"
              echo "Build do Mac concluído."
              exit 0
              ;;
            queued|running)
              rm -f "${errfile}" "${logfile}"
              sleep "${interval}"
              ;;
            *)
              echo "Estado desconhecido: ${state}."
              rm -f "${errfile}" "${logfile}"
              exit 1
              ;;
          esac
        done
