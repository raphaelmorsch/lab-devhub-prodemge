apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: trigger-ios-build
  namespace: prodemge
  labels:
    app.kubernetes.io/part-of: prodemge-ios
spec:
  description: Registra um build iOS na fila do coordenador. O agente do Mac reserva esse job; a Task não envia comandos de shell.
  params:
    - name: coordinator-url
      type: string
      default: "http://macos-build-coordinator.prodemge.svc:8080"
    - name: coordinator-public-url
      type: string
      default: "https://macos-build-coordinator-prodemge.apps.ocp.bct9l.sandbox1479.opentlc.com"
    - name: gitlab-url
      type: string
      default: ""
      description: Mantido para pipelines já gerados. O coordenador não usa o GitLab CI.
    - name: project-id
      type: string
      default: ""
      description: Mantido para pipelines já gerados. O coordenador não usa o projeto de CI.
    - name: git-ref
      type: string
      default: ""
      description: Mantido para pipelines já gerados. A revisão compilada é source-revision.
    - name: react-native-version
      type: string
      default: "rn-0.87.1"
    - name: source-url
      type: string
      default: ""
    - name: source-subdirectory
      type: string
      default: ""
    - name: source-revision
      type: string
      default: ""
      description: Branch, tag ou commit da aplicação que o Mac deve compilar.
    - name: run-ios
      type: string
      default: "false"
    - name: build-request-id
      type: string
      description: Identificador único desta execução. Um novo PipelineRun pode repetir um pedido que falhou.
    - name: secret-name
      type: string
      default: macos-build-api
  results:
    - name: gitlab-pipeline-id
      description: Identificador do build na fila do coordenador.
    - name: gitlab-pipeline-url
      description: URL do build no coordenador.
    - name: git-sha
      description: Revisão solicitada, confirmada pelo coordenador.
  steps:
    - name: trigger
      image: image-registry.openshift-image-registry.svc:5000/openshift/nodejs:22-ubi8
      env:
        - name: COORDINATOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.secret-name)
              key: token
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [ -z "${COORDINATOR_TOKEN}" ]; then
          echo "Token do coordenador ausente no Secret $(params.secret-name)."
          exit 1
        fi
        if [ "$(params.run-ios)" != "true" ]; then
          echo "RUN_IOS precisa ser true para enfileirar o build no Mac."
          exit 1
        fi
        base="$(params.coordinator-url)"
        base="${base%/}"
        public="$(params.coordinator-public-url)"
        public="${public%/}"
        payload="$(node -e '
          const payload = {
            build_request_id: process.argv[1],
            source_url: process.argv[2],
            source_revision: process.argv[3],
            source_subdirectory: process.argv[4],
            react_native_version: process.argv[5],
            script_set: "ios-build-v1"
          };
          process.stdout.write(JSON.stringify(payload));
        ' "$(params.build-request-id)" "$(params.source-url)" "$(params.source-revision)" "$(params.source-subdirectory)" "$(params.react-native-version)")"
        tmp="$(mktemp)"
        status="$(curl -sS --max-time 60 -o "${tmp}" -w "%{http_code}" \
          -X POST \
          -H "Authorization: Bearer ${COORDINATOR_TOKEN}" \
          -H "Content-Type: application/json" \
          --data "${payload}" \
          "${base}/builds" || true)"
        if [ "${status}" != "201" ] && [ "${status}" != "200" ]; then
          echo "Falha ao registrar o build iOS. HTTP ${status}."
          rm -f "${tmp}"
          exit 1
        fi
        node -e '
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
          if (!data.id || !data.source_revision) {
            console.error("Resposta do coordenador sem id ou revisão.");
            process.exit(2);
          }
          const page = process.argv[3].replace(/\/$/, "") + "/builds/" + data.id;
          fs.writeFileSync(process.argv[2], String(data.id));
          fs.writeFileSync(process.argv[4], page);
          fs.writeFileSync(process.argv[5], String(data.source_revision));
          console.log("Build " + data.id + " registrado para " + data.source_revision);
          console.log(page);
        ' "${tmp}" \
          "$(results.gitlab-pipeline-id.path)" \
          "${public}" \
          "$(results.gitlab-pipeline-url.path)" \
          "$(results.git-sha.path)"
        rm -f "${tmp}"
