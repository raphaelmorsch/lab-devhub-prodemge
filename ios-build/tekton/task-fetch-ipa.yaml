apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: fetch-ios-ipa
  namespace: prodemge
  labels:
    app.kubernetes.io/part-of: prodemge-ios
spec:
  description: Baixa o IPA publicado pelo Mac no coordenador e deixa o arquivo no workspace.
  params:
    - name: coordinator-url
      type: string
      default: "http://macos-build-coordinator.prodemge.svc:8080"
    - name: gitlab-url
      type: string
      default: ""
      description: Mantido para pipelines já gerados. O download vem do coordenador.
    - name: project-id
      type: string
      default: ""
      description: Mantido para pipelines já gerados.
    - name: pipeline-id
      type: string
      description: Identificador do build devolvido pelo coordenador.
    - name: secret-name
      type: string
      default: macos-build-api
  workspaces:
    - name: source
  results:
    - name: ipa-path
      description: Caminho do IPA dentro do workspace.
  steps:
    - name: fetch
      image: image-registry.openshift-image-registry.svc:5000/openshift/nodejs:22-ubi8
      env:
        - name: COORDINATOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: $(params.secret-name)
              key: token
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [ -z "${COORDINATOR_TOKEN}" ]; then
          echo "Token do coordenador ausente no Secret $(params.secret-name)."
          exit 1
        fi
        base="$(params.coordinator-url)"
        base="${base%/}"
        build="$(params.pipeline-id)"
        dest="$(workspaces.source.path)/ipa"
        rm -rf "${dest}"
        mkdir -p "${dest}"
        archive="${dest}/app.ipa"
        tmp="$(mktemp)"
        status="$(curl -sS --max-time 180 -o "${archive}" -w "%{http_code}" \
          -H "Authorization: Bearer ${COORDINATOR_TOKEN}" \
          -D "${tmp}" \
          "${base}/builds/${build}/artifact" || true)"
        if [ "${status}" != "200" ]; then
          echo "Download do IPA falhou. HTTP ${status}."
          rm -f "${tmp}" "${archive}"
          exit 1
        fi
        rm -f "${tmp}"
        node -e '
          const fs = require("fs");
          const fd = fs.openSync(process.argv[1], "r");
          const buf = Buffer.alloc(2);
          const read = fs.readSync(fd, buf, 0, 2, 0);
          fs.closeSync(fd);
          if (read !== 2 || buf[0] !== 0x50 || buf[1] !== 0x4b) {
            process.exit(1);
          }
        ' "${archive}" || {
          echo "O arquivo recebido não é um IPA."
          rm -f "${archive}"
          exit 1
        }
        printf '%s' "${archive}" > "$(results.ipa-path.path)"
        echo "IPA em ${archive}"
