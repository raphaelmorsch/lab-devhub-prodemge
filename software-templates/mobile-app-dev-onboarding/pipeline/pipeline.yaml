{%- if values.stack == "rn-0.68.7" -%}
{%- set node_version = "16.20.2" -%}
{%- set java_image = "image-registry.openshift-image-registry.svc:5000/openshift/ubi8-openjdk-11:1.18" -%}
{%- set compile_sdk = "33" -%}
{%- set build_tools = "30.0.2" -%}
{%- set ndk_version = "21.3.6528147" -%}
{%- else -%}
{%- set node_version = "24.12.0" -%}
{%- set java_image = "image-registry.openshift-image-registry.svc:5000/openshift/ubi8-openjdk-17:1.18" -%}
{%- set compile_sdk = "37" -%}
{%- set build_tools = "37.0.0" -%}
{%- set ndk_version = "27.1.12297006" -%}
{%- endif -%}
{%- if values.stack == "rn-0.88.1" -%}
{%- set gradle_task = "assembleRelease" -%}
{%- set publish_flavor = "" -%}
{%- else -%}
{%- set gradle_task = "assembleDesenvolvimentoRelease" -%}
{%- set publish_flavor = "desenvolvimento" -%}
{%- endif -%}
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: ${{ values.component_id }}-android
  namespace: prodemge
  labels:
    backstage.io/kubernetes-id: ${{ values.component_id }}
    type: pipeline
spec:
  description: Clone, dependências, análise estática no SonarQube, build de desenvolvimento e publicação na App Store Mock.
  params:
    - name: source-url
      type: string
      default: ${{ values.source_url | dump }}
    - name: source-revision
      type: string
      default: ${{ values.source_revision | dump }}
    - name: java-image
      type: string
      default: ${{ java_image | dump }}
    - name: node-version
      type: string
      default: ${{ node_version | dump }}
    - name: compile-sdk
      type: string
      default: ${{ compile_sdk | dump }}
    - name: build-tools
      type: string
      default: ${{ build_tools | dump }}
    - name: ndk-version
      type: string
      default: ${{ ndk_version | dump }}
    - name: enable-publish
      type: string
      description: Quando true, publica o APK na App Store Mock após o build.
      default: "true"
    - name: mock-store-url
      type: string
      default: "http://app-store-mock.prodemge.svc:8080"
    - name: app-id
      type: string
      default: ${{ values.component_id | dump }}
    - name: sonar-host-url
      type: string
      default: "http://sonarqube.sonarqube.svc.cluster.local:9000"
    - name: sonar-project-key
      type: string
      default: ${{ values.component_id | dump }}
  workspaces:
    - name: source
  tasks:
    - name: clone
      taskRef:
        kind: ClusterTask
        name: git-clone
      params:
        - name: url
          value: $(params.source-url)
        - name: revision
          value: $(params.source-revision)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: source
    - name: dependencies
      runAfter:
        - clone
      taskRef:
        name: ${{ values.component_id }}-dependencies
      params:
        - name: java-image
          value: $(params.java-image)
        - name: node-version
          value: $(params.node-version)
        - name: compile-sdk
          value: $(params.compile-sdk)
        - name: build-tools
          value: $(params.build-tools)
        - name: ndk-version
          value: $(params.ndk-version)
      workspaces:
        - name: source
          workspace: source
    - name: static-analysis
      runAfter:
        - dependencies
      taskRef:
        name: ${{ values.component_id }}-static-analysis
      params:
        - name: sonar-host-url
          value: $(params.sonar-host-url)
        - name: project-key
          value: $(params.sonar-project-key)
      workspaces:
        - name: source
          workspace: source
    - name: build
      runAfter:
        - static-analysis
      taskRef:
        name: ${{ values.component_id }}-build
      params:
        - name: java-image
          value: $(params.java-image)
        - name: gradle-task
          value: ${{ gradle_task | dump }}
      workspaces:
        - name: source
          workspace: source
    - name: publish
      runAfter:
        - build
      when:
        - input: "$(params.enable-publish)"
          operator: in
          values:
            - "true"
      taskRef:
        name: ${{ values.component_id }}-publish
      params:
        - name: java-image
          value: $(params.java-image)
        - name: mock-store-url
          value: $(params.mock-store-url)
        - name: app-id
          value: $(params.app-id)
        - name: flavor
          value: ${{ publish_flavor | dump }}
      workspaces:
        - name: source
          workspace: source
