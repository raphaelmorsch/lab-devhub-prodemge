{%- if values.stack == "rn-0.68.7" -%}
{%- set node_version = "16.20.2" -%}
{%- set java_image = "image-registry.openshift-image-registry.svc:5000/openshift/ubi8-openjdk-11:1.18" -%}
{%- set compile_sdk = "33" -%}
{%- set build_tools = "30.0.2" -%}
{%- set ndk_version = "21.3.6528147" -%}
{%- else -%}
{%- set node_version = "24.12.0" -%}
{%- set java_image = "image-registry.openshift-image-registry.svc:5000/openshift/ubi8-openjdk-17:1.18" -%}
{%- set compile_sdk = "37" -%}
{%- set build_tools = "37.0.0" -%}
{%- set ndk_version = "27.1.12297006" -%}
{%- endif -%}
{%- if values.stack == "rn-0.88.1" -%}
{%- set gradle_task = "assembleRelease" -%}
{%- set publish_flavor = "" -%}
{%- else -%}
{%- set gradle_task = "assembleDesenvolvimentoRelease" -%}
{%- set publish_flavor = "desenvolvimento" -%}
{%- endif -%}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ values.component_id }}-build
  namespace: prodemge
  labels:
    backstage.io/kubernetes-id: ${{ values.component_id }}
data:
  source-url: ${{ values.source_url | dump }}
  source-revision: ${{ values.source_revision | dump }}
  source-subdirectory: ${{ values.source_subdirectory | default('', true) | dump }}
  stack: ${{ values.stack | dump }}
  flavor: ${{ publish_flavor | dump }}
  gradle-task: ${{ gradle_task | dump }}
  node-version: ${{ node_version | dump }}
  java-image: ${{ java_image | dump }}
  compile-sdk: ${{ compile_sdk | dump }}
  build-tools: ${{ build_tools | dump }}
  ndk-version: ${{ ndk_version | dump }}
  sonar-host-url: "http://sonarqube.sonarqube.svc.cluster.local:9000"
  sonar-project-key: ${{ values.component_id | dump }}
  mock-store-url: "http://app-store-mock.prodemge.svc:8080"
  enable-publish: "true"
  publish: ready
