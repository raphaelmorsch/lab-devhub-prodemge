apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: ${{ values.component_id }}-build
  namespace: prodemge
  labels:
    backstage.io/kubernetes-id: ${{ values.component_id }}
spec:
  description: Gera o APK release do flavor escolhido com o Gradle wrapper da aplicação.
  params:
    - name: java-image
      type: string
    - name: gradle-task
      type: string
  workspaces:
    - name: source
  steps:
    - name: assemble
      image: $(params.java-image)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        SRC="$(workspaces.source.path)"
        TOOLS="${SRC}/.ci-tools"
        export HOME="${TOOLS}/home"
        export ANDROID_SDK_ROOT="${TOOLS}/android-sdk"
        export ANDROID_HOME="${ANDROID_SDK_ROOT}"
        export PATH="${TOOLS}/node/bin:${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
        cd "${SRC}/android"
        chmod +x ./gradlew
        ./gradlew "$(params.gradle-task)" --no-daemon --stacktrace
