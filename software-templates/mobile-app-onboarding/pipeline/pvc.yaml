apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${{ values.component_id }}-source
  namespace: prodemge
  labels:
    backstage.io/kubernetes-id: ${{ values.component_id }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ocs-external-storagecluster-ceph-rbd
  resources:
    requests:
      storage: 20Gi
