apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mobile-app-onboarding
  title: Onboarding de aplicação mobile
  description: >
    Registra uma aplicação React Native já existente no catálogo e gera o
    pipeline Tekton de Clone, Dependencies, Build, Sign e Publish na App
    Store Mock. Um push na branch da aplicação, na versão desta esteira,
    dispara o pipeline. A Application Argo CD publica os manifestos.
  tags:
    - react-native
    - android
    - tekton
spec:
  owner: prodemge
  type: service
  parameters:
    - title: Aplicação existente
      required:
        - component_id
        - source_url
        - stack
        - webhook_secret
      properties:
        component_id:
          title: Nome no catálogo
          type: string
          description: Identificador único. Use letras minúsculas, números e hífen.
          pattern: '^[a-z][a-z0-9-]{1,28}$'
          ui:field: EntityNamePicker
        title:
          title: Título
          type: string
          default: SISP Mobile
        description:
          title: Descrição
          type: string
          default: Aplicação mobile registrada pelo template de onboarding do laboratório PRODEMGE.
        owner:
          title: Dono
          type: string
          default: prodemge
        source_url:
          title: URL Git do repositório existente
          type: string
          description: Clone URL da aplicação, por exemplo https://gitlab-gitlab.apps.ocp.bct9l.sandbox1479.opentlc.com/development/sidsmobile.git. O template não altera esse código.
        source_revision:
          title: Branch ou tag
          type: string
          default: main
          description: Para as referências institucionais, master é a 0.68.7 e b-atualizacao-react é a 0.87.1.
        stack:
          title: Pilha React Native
          type: string
          default: rn-0.87.1
          enum:
            - rn-0.68.7
            - rn-0.87.1
          enumNames:
            - React Native 0.68.7 (Node 16, JDK 11)
            - React Native 0.87.1 (Node 24, JDK 17)
        flavor:
          title: Flavor do build
          type: string
          default: homologacao
          enum:
            - desenvolvimento
            - homologacao
            - treinamento
            - producao
        source_subdirectory:
          title: Pasta da versão no repositório
          type: string
          description: >
            Preencha quando o mesmo repositório guarda mais de uma versão.
            No laboratório, a 0.87.1 fica em sidsmobile-rn-0.87.1 e a 0.68.7
            em sidsmobile-rn-0.68.7. O push só dispara esta esteira se alterar
            arquivos dessa pasta. Deixe vazio quando o repositório contém só
            a aplicação desta versão.
        webhook_secret:
          title: Segredo do webhook
          type: string
          description: >
            Token compartilhado com o webhook de push do Git. O EventListener
            recusa chamadas sem esse segredo. Ele fica no Secret do namespace
            e também no repositório de manifestos.
          ui:widget: password
    - title: Onde publicar os manifestos
      required:
        - repo
      properties:
        repo:
          title: Repositório dos manifestos
          type: object
          description: O código da aplicação permanece no repositório de origem. Aqui fica só o catálogo e o pipeline.
          properties:
            host:
              title: Host do GitLab
              type: string
              description: Deve coincidir com integrations.gitlab.host do Developer Hub.
              default: gitlab-gitlab.apps.ocp.bct9l.sandbox1479.opentlc.com
              enum:
                - gitlab-gitlab.apps.ocp.bct9l.sandbox1479.opentlc.com
            owner:
              title: Grupo
              type: string
              default: development
              enum:
                - development

  steps:
    - id: fetch-catalog
      name: Gerar a entidade do catálogo
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          title: ${{ parameters.title }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          source_url: ${{ parameters.source_url }}
          source_revision: ${{ parameters.source_revision }}
          stack: ${{ parameters.stack }}
          flavor: ${{ parameters.flavor }}
          source_subdirectory: ${{ parameters.source_subdirectory }}
          host: ${{ parameters.repo.host }}
          destination: ${{ parameters.repo.owner }}/${{ parameters.component_id }}-onboarding

    - id: fetch-pipeline
      name: Gerar o pipeline Tekton
      action: fetch:template
      input:
        url: ./pipeline
        targetPath: ./pipeline
        values:
          component_id: ${{ parameters.component_id }}
          source_url: ${{ parameters.source_url }}
          source_revision: ${{ parameters.source_revision }}
          stack: ${{ parameters.stack }}
          flavor: ${{ parameters.flavor }}
          source_subdirectory: ${{ parameters.source_subdirectory }}
          webhook_secret: ${{ parameters.webhook_secret }}

    - id: publish
      name: Publicar catálogo e pipeline
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host }}?owner=${{ parameters.repo.owner }}&repo=${{ parameters.component_id }}-onboarding"
        repoVisibility: public

    - id: register
      name: Registrar no Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    - id: apply-pipeline
      name: Configurar o build no OpenShift
      action: argocd:create-resources
      input:
        appName: ${{ parameters.component_id }}-pipeline
        projectName: ${{ parameters.component_id }}-pipeline
        argoInstance: main
        namespace: prodemge
        repoUrl: https://${{ parameters.repo.host }}/${{ parameters.repo.owner }}/${{ parameters.component_id }}-onboarding.git
        path: pipeline
        labelValue: ${{ parameters.component_id }}

  output:
    links:
      - title: Repositório dos manifestos
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Abrir no catálogo
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Pipeline no OpenShift
        url: https://console-openshift-console.apps.ocp.bct9l.sandbox1479.opentlc.com/k8s/ns/prodemge/tekton.dev~v1beta1~Pipeline/${{ parameters.component_id }}-android
        icon: kind:pod
      - title: Webhook de push
        url: https://${{ parameters.component_id }}-push-prodemge.apps.ocp.bct9l.sandbox1479.opentlc.com
        icon: kind:pod
