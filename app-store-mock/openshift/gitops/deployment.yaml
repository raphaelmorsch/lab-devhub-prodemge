apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-store-mock
  namespace: prodemge
  labels:
    app.kubernetes.io/name: app-store-mock
    rht-gitops.com/janus-argocd: app-store-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app-store-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-store-mock
    spec:
      containers:
        - name: app-store-mock
          image: image-registry.openshift-image-registry.svc:5000/prodemge/app-store-mock:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BUCKET_INSECURE
              value: "true"
            - name: BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-store-mock-bucket
                  key: BUCKET_NAME
            - name: BUCKET_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-store-mock-bucket
                  key: BUCKET_HOST
            - name: BUCKET_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-store-mock-bucket
                  key: BUCKET_PORT
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: app-store-mock-bucket
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-store-mock-bucket
                  key: AWS_SECRET_ACCESS_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
