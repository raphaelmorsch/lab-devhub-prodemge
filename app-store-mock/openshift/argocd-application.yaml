apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: app-store-mock
  namespace: janus-argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: PRODEMGE App Store Mock
  sourceRepos:
    - https://gitlab-gitlab.apps.cluster-br764.dyn.redhatworkshops.io/development/app-store-mock-gitops.git
  destinations:
    - namespace: prodemge
      server: https://kubernetes.default.svc
      name: local
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-store-mock
  namespace: janus-argocd
  labels:
    backstage-name: app-store-mock
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: app-store-mock
  source:
    repoURL: https://gitlab-gitlab.apps.cluster-br764.dyn.redhatworkshops.io/development/app-store-mock-gitops.git
    path: openshift
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: prodemge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
